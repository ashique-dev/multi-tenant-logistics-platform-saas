global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # NOTE: app endpoints expose /metrics starting Phase 7; targets show DOWN until then.
  - job_name: api
    metrics_path: /metrics
    static_configs: [{ targets: ['api:3000'] }]
  - job_name: worker
    static_configs: [{ targets: ['worker:9100'] }]
  - job_name: relay
    static_configs: [{ targets: ['relay:9100'] }]
  - job_name: postgres
    static_configs: [{ targets: ['postgres-exporter:9187'] }]
  - job_name: redis-cache
    static_configs: [{ targets: ['redis-exporter-cache:9121'] }]
  - job_name: redis-queue
    static_configs: [{ targets: ['redis-exporter-queue:9121'] }]
  - job_name: kafka
    static_configs: [{ targets: ['kafka-exporter:9308'] }]
  - job_name: rabbitmq
    static_configs: [{ targets: ['rabbitmq:15692'] }]
  - job_name: otel-collector
    static_configs: [{ targets: ['otel-collector:8888', 'otel-collector:8889'] }]
