# Edge / API-gateway simulation. Owns: TLS termination (prod), routing, request ID,
# coarse per-IP rate limiting. Does NOT own business, tenant or resource authorization.
worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 1m;

  # Reuse a client-supplied X-Request-Id, otherwise mint one (nginx $request_id = 32 hex).
  map $http_x_request_id $req_id { default $http_x_request_id; "" $request_id; }

  # Coarse edge limit; fine-grained user/tenant/endpoint limits live in the app (Redis).
  limit_req_zone $binary_remote_addr zone=edge:10m rate=30r/s;
  limit_req_status 429;

  upstream api { server api:3000; keepalive 32; }

  log_format json escape=json
    '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
    '"uri":"$uri","status":$status,"request_id":"$req_id","upstream_ms":"$upstream_response_time"}';
  access_log /dev/stdout json;

  server {
    listen 8080;

    location = /metrics { return 404; }            # internal scrape network only
    location = /health/ready { return 404; }       # readiness is for the orchestrator, not the internet

    location / {
      limit_req zone=edge burst=60 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $req_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
      add_header X-Request-Id $req_id always;
    }
  }
}
